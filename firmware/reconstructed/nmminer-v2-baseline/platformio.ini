[platformio]
default_envs = esp32-2432s028r-st7789-baseline

[env:esp32-2432s028r-st7789-baseline]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_official_v2002.csv
extra_scripts = pre:scripts/guard_no_upload.py
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -D ESP32_2432S028R=1
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=12
    -D TFT_BL=21
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^8.4.0
