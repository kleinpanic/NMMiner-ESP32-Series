    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1        
    -D ARDUINO_USB_CDC_ON_BOOT=1   
    -D ESP32RGB=1
    -D RGB_LED_PIN=38
    ;-D DEBUG_MINING=1

