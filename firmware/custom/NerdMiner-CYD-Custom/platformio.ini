[env:ESP32-2432S028R]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
extra_scripts =
    pre:auto_firmware_version.py
    post:post_build_merge.py
monitor_speed = 115200
monitor_filters = 
	esp32_exception_decoder
	time	
	colorize
	;debug
upload_speed = 921600
;build_type = debug
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<.git/> -<.svn/>
; -O3 instead of the Arduino default -Os: HenrysCat measured +3% on the HW
; SHA path (HW counter ~640 -> ~660 kH/s).
build_unflags = -Os
build_flags =
	-O3
	-funroll-loops
	;-DDEBUG_MEMORY=1
	; Pipelined classic-ESP32 HW SHA256d loop (src/pipelined_hw_sha_classic_v2.S)
	; behind a power-on self-test, with the plain loop as the fallback.
	-D PIPELINED_ASM_MINING=1
	; That loop owns core 1 at priority 19 and never yields mid-chunk, so
	; Arduino's loopTask (web API, Wi-Fi manager) would starve there and
	; arduino_events (priority 19 too) would time-slice against it. Both
	; default to core 1; move them to core 0 with the other app tasks.
	-D ARDUINO_RUNNING_CORE=0
	-D ARDUINO_EVENT_RUNNING_CORE=0
	-D ESP32_2432S028R=1
	-DNO_POOL_STATS_API=1
	-DPANICMINER_UI=1
	; Preserve per-certificate failure flags before Arduino frees the TLS context.
	-Wl,--wrap=mbedtls_x509_crt_verify_restartable
	-Wl,--wrap=mbedtls_pk_verify_ext
	; This unit's radio is not heard by the router at full power (auth expires);
	; at 7 dBm auth works but the WPA2 handshake times out. 13 dBm with
	; 802.11b-only rates joins on the first try (2026-11-25).
	-DPM_WIFI_TXPOWER=WIFI_POWER_13dBm
	-DPM_WIFI_11B=1
	-DLV_CONF_INCLUDE_SIMPLE=1
	-I src/ui
	-DUSER_SETUP_LOADED=1
	-DILI9341_2_DRIVER=1
	; This unit's panel is the ST7789 version of the CYD. Without INVON it shows a
	; colour negative: the black background came out white and pink came out
	; teal (photo, 2026-11-25). Upstream's ESP32_2432S028_2USB env sets the same.
	-DTFT_INVERSION_ON
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=12
	-DTFT_BL=21
	-DETOUCH_CS=33
	-DTOUCH_CLK=25
	-DTOUCH_MISO=39
	-DTOUCH_MOSI=32
	-DTOUCH_IRQ=36
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	
lib_deps = 
	https://github.com/takkaO/OpenFontRender#v1.2
	bblanchon/ArduinoJson@^6.21.5
	https://github.com/tzapu/WiFiManager.git#v2.0.17
	mathertel/oneButton@^2.6.1
	arduino-libraries/NTPClient@^3.2.1
	bodmer/TFT_eSPI@^2.5.43
	https://github.com/achillhasler/TFT_eTouch
	lvgl/lvgl@8.3.11
lib_ignore =
	HANSOLOminerv2

; On-chip SHA engine bench for the CYD (src/sha_bench*.cpp). It runs instead
; of the miner and prints to serial forever; the screen stays dark.
; SHA_BENCH=2 checks every loop variant in src/sha_bench_variants.inc against
; software, hash by hash, with a different kind of core-0 bus traffic per
; pass. 1 measures the engine's timing, 3 the other core's interference.
[env:ESP32-2432S028R-bench]
extends = env:ESP32-2432S028R
build_flags =
	${env:ESP32-2432S028R.build_flags}
	-D SHA_BENCH=2

